<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Item Pixel Art Generator</title>
  </head>
  <body>
    <main>Loading item art generator...</main>
    <script type="module">
      import {
        PIXEL_ART_PROFILES,
        renderPixelArtwork
      } from "../js/ui.js?v=20261005-01";

      function loadSvgImage(svgMarkup) {
        return new Promise((resolve, reject) => {
          const blob = new Blob([svgMarkup], {
            type: "image/svg+xml;charset=utf-8"
          });
          const url = URL.createObjectURL(blob);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("SVG image failed"));
          };
          image.src = url;
        });
      }

      async function generateItemPixelAssets(options = {}) {
        const blockSize = Math.max(1, Number(options.blockSize) || 3);
        const width = Math.max(160, Number(options.width) || 640);
        const height = Math.max(140, Number(options.height) || 560);
        const results = {};

        for (const profile of PIXEL_ART_PROFILES) {
          const image = await loadSvgImage(
            renderPixelArtwork({ name: profile }, profile)
          );
          const lowCanvas = document.createElement("canvas");
          lowCanvas.width = Math.max(1, Math.floor(width / blockSize));
          lowCanvas.height = Math.max(1, Math.floor(height / blockSize));
          const lowContext = lowCanvas.getContext("2d");
          lowContext.imageSmoothingEnabled = true;
          lowContext.drawImage(image, 0, 0, lowCanvas.width, lowCanvas.height);

          const outputCanvas = document.createElement("canvas");
          outputCanvas.width = width;
          outputCanvas.height = height;
          const outputContext = outputCanvas.getContext("2d");
          outputContext.imageSmoothingEnabled = false;
          outputContext.drawImage(
            lowCanvas,
            0,
            0,
            lowCanvas.width,
            lowCanvas.height,
            0,
            0,
            width,
            height
          );
          results[profile] = outputCanvas
            .toDataURL("image/png")
            .split(",")[1];
        }

        return results;
      }

      window.generateItemPixelAssets = generateItemPixelAssets;
      window.itemArtGeneratorReady = true;
      document.querySelector("main").textContent =
        "Item art generator is ready.";
    </script>
  </body>
</html>
